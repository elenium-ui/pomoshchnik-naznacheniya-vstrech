name: Deploy Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      PUBLIC_HEALTHCHECK_URL: ${{ vars.PUBLIC_HEALTHCHECK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required CI variables and secrets
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(VPS_HOST VPS_SSH_USER VPS_SSH_PORT VPS_APP_DIR)
          for key in "${required_vars[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required repository variable: $key"
              exit 1
            fi
          done

          if [[ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]]; then
            echo "Missing required repository secret: VPS_SSH_PRIVATE_KEY"
            exit 1
          fi

          if [[ -z "${{ secrets.VPS_KNOWN_HOSTS }}" ]]; then
            echo "Missing required repository secret: VPS_KNOWN_HOSTS"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf "%s\n" "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          printf "%s\n" "${{ secrets.VPS_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Ensure app directory exists on VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_SSH_PORT" \
            "$VPS_SSH_USER@$VPS_HOST" \
            "mkdir -p '$VPS_APP_DIR'"

      - name: Sync project files to VPS
        shell: bash
        run: |
          set -euo pipefail

          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '.pytest_cache' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude '.env.production' \
            --exclude 'secrets/' \
            --exclude 'data/' \
            --exclude 'logs/' \
            -e "ssh -i $HOME/.ssh/id_ed25519 -p $VPS_SSH_PORT" \
            ./ "$VPS_SSH_USER@$VPS_HOST:$VPS_APP_DIR/"

      - name: Deploy on VPS
        shell: bash
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_SSH_PORT" \
            "$VPS_SSH_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && chmod +x scripts/deploy-on-server.sh && PUBLIC_HEALTHCHECK_URL='${PUBLIC_HEALTHCHECK_URL:-}' ./scripts/deploy-on-server.sh"
