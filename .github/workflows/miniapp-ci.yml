name: Mini App CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Run unit/integration tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/unit/test_config.py \
            tests/integration/test_background_jobs.py \
            tests/integration/test_user_entry.py \
            tests/integration/test_booking_user_actions.py \
            tests/integration/test_booking_draft_flow.py \
            tests/integration/test_booking_slot_hold.py \
            tests/integration/test_admin_stage8.py

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/miniapp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build Mini App frontend
        env:
          VITE_API_BASE_URL: https://api.example.com
        run: npm run build
